name: lesson_flutter
description: "A new Flutter project."

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  slideable: ^0.0.3
  flutter_slidable: ^4.0.3
  sliding_up_panel: ^2.0.0+1
  google_maps_flutter: ^2.14.2
  geolocator: ^14.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  dropdown_flutter: ^1.0.3
  crypto: ^3.0.7
  google_fonts: ^8.0.2
  multi_dropdown: ^3.1.1
  flutter_pdfview: ^1.4.4
  dio: ^5.9.2
  permission_handler: ^12.0.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  shared_preferences_storage_view_driver: ^0.1.0-dev.5
  get_it: ^9.2.1
  get: ^4.7.3


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

